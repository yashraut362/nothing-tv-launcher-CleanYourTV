<!doctype html>
<html><head><meta charset="utf-8"><title>Concept A — Index — Inputs panel open</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .top { position: absolute; left: var(--safe-x); right: var(--safe-x); top: var(--safe-y); height: 150px; }
  .time { position: absolute; left: 0; top: 0; }
  .time .date { margin-top: 10px; }
  .readouts { position: absolute; right: 0; top: 4px; }
  .section { position: absolute; left: var(--safe-x); right: var(--safe-x); }
  .row { display: flex; gap: var(--gutter); margin-top: 26px; }
  .dimmed { opacity: 0.35; }
  /* The panel: ground-coloured, hairline border, rows 48 px, opens under the readout. */
  .panel { position: absolute; right: var(--safe-x); top: 96px; width: 300px; background: var(--ground); border: 1px solid var(--hairline-strong); border-radius: var(--radius-panel); overflow: hidden; }
  .prow { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: var(--font-label); font-size: var(--size-label); letter-spacing: .08em; text-transform: uppercase; color: var(--text); border-top: 1px solid var(--hairline); }
  .prow:first-child { border-top: 0; }
  .prow .state { color: var(--text-3); font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .prow.focused { background: var(--text); color: var(--ground); }
  .prow.focused .state { color: var(--ground); }
</style></head>
<body>
  <div class="top">
    <div class="time dimmed">
      <div class="clock">20:41</div>
      <div class="label date">SAT <span class="dim">(</span> 24 OCT <span class="dim">)</span></div>
    </div>
    <div class="readouts">
      <div class="readout focused">Inputs <span class="dot"></span></div>
      <div class="readout">Wi-Fi</div>
      <div class="readout">Settings</div>
    </div>
  </div>

  <div class="panel">
    <div class="prow">HDMI 1</div>
    <div class="prow focused">HDMI 2 <span class="state"><span class="dot"></span>Connected</span></div>
    <div class="prow">HDMI 3</div>
    <div class="prow">AV</div>
    <div class="prow">Live TV</div>
  </div>

  <div class="section dimmed" style="top: 236px">
    <div class="rule"><span class="tag label">Pinned <span class="dim">( 4 )</span></span></div>
    <div class="row">
      <div class="tile"><div class="art"><img src="banners/youtube.png"></div><div class="caption"><span class="idx">01</span></div></div>
      <div class="tile"><div class="art"><img src="banners/prime.png"></div><div class="caption"><span class="idx">02</span></div></div>
      <div class="tile"><div class="art"><img src="banners/hotstar.png"></div><div class="caption"><span class="idx">03</span></div></div>
      <div class="tile"><div class="art"><img src="banners/zee5.png"></div><div class="caption"><span class="idx">04</span></div></div>
    </div>
  </div>
  <div class="section dimmed" style="top: 486px">
    <div class="rule"><span class="tag label">All apps <span class="dim">( 4 )</span></span></div>
    <div class="row">
      <div class="tile"><div class="art"><img src="banners/gallery.png"></div><div class="caption"><span class="idx">05</span></div></div>
      <div class="tile"><div class="art"><img src="banners/livetv.png"></div><div class="caption"><span class="idx">06</span></div></div>
      <div class="tile"><div class="art"><img src="banners/media.png"></div><div class="caption"><span class="idx">07</span></div></div>
      <div class="tile"><div class="art"><img src="banners/play.png"></div><div class="caption"><span class="idx">08</span></div></div>
    </div>
  </div>
</body></html>
